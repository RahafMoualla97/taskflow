services:
  # ===== Database =====
  db:
    image: postgres:15-alpine
    container_name: taskflow_db
    environment:
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_pass
      POSTGRES_DB: taskflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Backend =====
  backend:
    build: ./backend
    container_name: taskflow_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://taskflow_user:taskflow_pass@db:5432/taskflow_db
      SECRET_KEY: your-super-secret-key-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost:5173
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USERNAME: your-email@gmail.com
      EMAIL_PASSWORD: your-app-password
      FROM_EMAIL: your-email@gmail.com
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["./entrypoint.sh"]
    restart: unless-stopped

  # ===== Frontend =====
  frontend:
    build: ./frontend
    container_name: taskflow_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: